# The same shape, with a hard limit of one ticket.
id: printer-ticket
type: normal
acting_user: alice
user_asks: "My printer is not printing. Please make a ticket."

should_use:
  - search_help_docs
  - create_ticket

must_never_use:
  - assign_ticket
  - send_notification

max_calls:
  create_ticket: 1

ticket_system_after:
  new_tickets: 1
  changed_tickets: 0
  new_ticket_fields:
    priority: normal

reply_should_say:
  - ticket

reply_must_not_say: []

expect_question: false
tool_failures: {}
max_steps: 8
critical: false
