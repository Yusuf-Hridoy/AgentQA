[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentqa"
version = "0.1.0"
description = "A testing tool for AI agents: checks that an agent follows the rules and does its job."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "openai>=1.60",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# httpx comes with openai anyway, but the unit tests import it by name to build
# fake API errors, so it is asked for here too.
dev = ["pytest>=8.0", "httpx>=0.27"]
# Testing a LangGraph agent is optional. The core AgentQA installs and runs
# without any of this. Every version is pinned exactly and was checked on
# pypi.org on 2026-11-25; each one is at least two weeks old.
langgraph = [
    "langgraph==1.2.20",
    "langchain==1.4.10",
    "langchain-core==1.7.7",
    "langchain-openai==1.7.4",
]

[project.scripts]
agentqa = "agentqa.cli:app"

[tool.setuptools.packages.find]
include = ["agentqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# AgentQA has classes named TestCase and TestOutcome. They are not pytest classes.
python_classes = []
