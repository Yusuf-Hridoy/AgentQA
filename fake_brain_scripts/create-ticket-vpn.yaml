# Phase 1: this script is written so the test passes.
actions:
  - tool: search_help_docs
    inputs: { query: "vpn connection problem" }
  - tool: create_ticket
    inputs:
      title: "Cannot connect to the VPN from home"
      description: "The VPN does not connect from home. The help article did not solve it."
      priority: "normal"
  - reply: "I checked the help article first, then made a ticket for your VPN problem. IT support will look at it."
